[project]
name = "goldilocks-models"
version = "0.1.0"
description = "Train, log, and evaluate ML/LLM models for the Goldilocks DFT-recommendation system."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Junwen Yin", email = "junwen.yin@stfc.ac.uk" }]
license = { text = "MIT" }

dependencies = [
    # Data IO and feature engineering
    "pandas>=2.2",
    "pyarrow>=15",          # read Parquet datasets produced by goldilocks-data
    "numpy>=1.26",
    "scikit-learn>=1.4",
    # Baseline ML models
    "xgboost>=2.0",
    "lightgbm>=4.3",
    # Configuration management (Hydra stack)
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydantic>=2.6",
    # Experiment tracking
    "mlflow>=2.12",
    # Command-line interface
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
nn = [
    "torch>=2.2",
    "lightning>=2.2",
]
gnn = [
    "torch>=2.2",
    "torch-geometric>=2.5",
    # Companion packages below are CUDA/platform-specific; install separately if needed:
    #   uv pip install torch-scatter torch-sparse torch-cluster \
    #     -f https://data.pyg.org/whl/torch-2.2.0+cpu.html
    # PyG >=2.5 works without them for most operators.
]
llm = [
    "transformers>=4.40",
    "peft>=0.10",
    "accelerate>=0.29",
    "datasets>=2.18",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
gm = "goldilocks_models.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldilocks_models"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
